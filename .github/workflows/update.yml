name: Update index

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - sources.json
      - scripts/**
      - test/**
      - package.json
      - package-lock.json
      - .github/workflows/update.yml

permissions:
  contents: read

concurrency:
  group: update-index
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Record snapshot base
        id: base
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: npm ci --ignore-scripts
      - name: Run collector tests
        run: npm test
      - name: Collect public upstream metadata
        run: npm run update
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Validate generated index and worker feed
        run: npm run check
      - name: Publish changed snapshot
        shell: bash
        env:
          SNAPSHOT_BASE_COMMIT: ${{ steps.base.outputs.commit }}
        run: |
          set -euo pipefail
          git add index.json updates.json
          if git diff --cached --quiet; then
            echo 'No upstream changes.'
            exit 0
          fi
          git diff --cached --check
          git fetch --no-tags origin main
          if [ "$(git rev-parse FETCH_HEAD)" != "$SNAPSHOT_BASE_COMMIT" ]; then
            echo 'Main advanced during collection; skipping this snapshot.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(index): refresh upstream releases'
          if ! git push origin HEAD:main; then
            git fetch --no-tags origin main
            if [ "$(git rev-parse FETCH_HEAD)" != "$SNAPSHOT_BASE_COMMIT" ]; then
              echo 'Main advanced before push; skipping this snapshot.'
              exit 0
            fi
            echo 'Snapshot push failed without a concurrent main update.' >&2
            exit 1
          fi
